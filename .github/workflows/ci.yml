name: CI

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Build (release)
        run: cargo build --release --locked
      - name: Unit tests
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --all-targets --locked

  web:
    name: Web build (TanStack Start)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
        working-directory: frontend-next
      - run: bun run typecheck && bun run build
        working-directory: frontend-next
      - name: Report build size
        run: du -sh .output
        working-directory: frontend-next
      - uses: actions/upload-artifact@v4
        with:
          name: washjoy-static-build
          path: frontend-next/.output
          retention-days: 7

  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
        working-directory: frontend-next
      - run: bun run build
        working-directory: frontend-next
      - name: Install Chromium
        run: bun x playwright install --with-deps chromium
        working-directory: frontend-next
      - name: Run browser tests
        run: bun x playwright test --config playwright.config.ts
        working-directory: frontend-next
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend-next/playwright-report
          retention-days: 7
