[package]
name="washjoy-api"
version="0.1.0"
edition="2024"
[dependencies]
axum={version="0.8",features=["multipart"]}
base64="0.22"
hex="0.4"
rand="0.8"
rusqlite={version="0.32",features=["bundled"]}
sqlx={version="0.8",default-features=false,features=["runtime-tokio-rustls","postgres","chrono","json","migrate","macros"]}
chrono={version="0.4",features=["serde"]}
scrypt="0.11"
serde={version="1",features=["derive"]}
serde_json="1"
sha2="0.10"
tokio={version="1",features=["macros","rt-multi-thread","net","process"]}
[profile.release]
strip=true
lto="thin"
codegen-units=1
